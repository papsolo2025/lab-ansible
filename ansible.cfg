[defaults]
inventory            = inventories/aws_ec2.yml
roles_path           = roles
remote_user          = ubuntu
private_key_file     = ~/.ssh/devops-lab
host_key_checking    = False
interpreter_python   = auto_silent
forks                = 10
stdout_callback      = default
callback_result_format = yaml
retry_files_enabled  = False

[ssh_connection]
pipelining = True
